
name: SwagLabs_JavaSeleniumBDDFramework
on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

  schedule:
    - cron: '15 10 * * *'

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Execute SwagLabs BDD tests
        run: mvn clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BDD-SwagaLabs-Test-Reports
          path: |
            target/surefire-reports/
            target/cucumber-reports/
          if-no-files-found: ignore
